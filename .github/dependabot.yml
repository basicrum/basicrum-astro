version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # Keep types aligned with the oldest supported Node.js major (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Revisit when typescript-eslint supports TypeScript 7 and the build
      # scripts and module-boundary tests support its compiler and API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    # CodeQL init and analyze must always use the same action version.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
