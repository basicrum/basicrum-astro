version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    # CodeQL init and analyze must always use the same action version.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
