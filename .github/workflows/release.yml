name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        run: |
          commit=$(git rev-parse "HEAD^{commit}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $commit, which is on main."
          else
            echo "::error::Tag $GITHUB_REF_NAME points at $commit, which is not on main. Releases are cut from main only."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version and conventions
        env:
          BASICRUM_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run conventions

      - name: Check TypeScript declarations and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and browser tests
        run: |
          npm run test:unit
          npm run test:browser

      - name: Pack, install into a consumer and build
        run: npm run verify:package

      - name: Build release tarball and checksum
        run: |
          mkdir -p release
          tarball=$(npm pack --pack-destination release --silent | tail -n 1)
          (cd release && shasum -a 256 "$tarball" > "$tarball.sha256")
          cat "release/$tarball.sha256"

      - name: Upload verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: release
          if-no-files-found: error
          retention-days: 7

  # Only this job holds release authority. It runs no project code and no
  # dependency install: it publishes the tarball the verify job produced.
  publish:
    name: Create GitHub release and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release

      - name: Verify checksum
        working-directory: release
        run: shasum -a 256 -c -- *.sha256

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check for an npm credential
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not set; the npm publish step will be skipped."
          fi

      # Publish before creating the GitHub release so a publish failure leaves
      # no half-release. A re-run after a successful publish skips this step.
      - name: Publish to npm
        if: steps.npm.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@basicrum/astro@${version}" version >/dev/null 2>&1; then
            echo "@basicrum/astro@${version} is already on the registry; skipping publish."
          else
            npm publish release/*.tgz --provenance --access public
          fi

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tgz
            release/*.tgz.sha256
